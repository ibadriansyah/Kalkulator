name: Android Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version
        id: get_version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
          else
            VERSION=$(grep 'versionName = ' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
            TAG="v$VERSION"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version $VERSION (tag $TAG)"

      - name: Extract Changelog Section
        id: changelog
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          python3 -c "
          import re, sys
          version = sys.argv[1]
          try:
              with open('CHANGELOG.md', 'r') as f:
                  text = f.read()
              pattern = rf'## \[?{re.escape(version)}\]?[^\n]*\n(.*?)(?=\n## |\Z)'
              match = re.search(pattern, text, re.DOTALL)
              if match:
                  notes = match.group(1).strip()
              else:
                  notes = 'Release version ' + version
          except FileNotFoundError:
              notes = 'Release version ' + version
          with open('RELEASE_NOTES.md', 'w') as f:
              f.write(notes + '\n')
          " "$VERSION"
          echo "notes_file=RELEASE_NOTES.md" >> $GITHUB_OUTPUT

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Decode Keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > app/keystore.jks

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/app/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK for Release
        run: |
          TAG="${{ steps.get_version.outputs.tag }}"
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/Kalkulator-$TAG.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Kalkulator ${{ steps.get_version.outputs.tag }}
          tag_name: ${{ steps.get_version.outputs.tag }}
          draft: false
          prerelease: false
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/Kalkulator-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kalkulator-${{ steps.get_version.outputs.tag }}-apk
          path: app/build/outputs/apk/release/Kalkulator-*.apk
          retention-days: 60
